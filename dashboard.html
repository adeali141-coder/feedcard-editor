<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Album Feed Editor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    body { font-family: 'DM Sans', sans-serif; background: #373737; color: #fff; }
    .btn-a { background: linear-gradient(135deg, #e8572a, #ff7e47); color: #fff; border: none; border-radius: 10px; padding: 10px 20px; font-weight: 600; cursor: pointer; transition: all .2s; }
    .btn-a:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(232,87,42,0.3); }
    .btn-g { background: transparent; color: #aaa; border: 1px solid #2a2a2a; border-radius: 10px; padding: 8px 16px; cursor: pointer; transition: all .2s; }
    .btn-g:hover { color: #f0f0f0; border-color: #555; }
    .album-card { background: #111111; border: 1px solid #2a2a2a; border-radius: 16px; overflow: hidden; transition: transform .2s, border-color .2s; }
    .album-card:hover { transform: translateY(-4px); border-color: #e8572a; }
    .empty-state { border: 2px dashed #2a2a2a; border-radius: 16px; padding: 40px; text-align: center; color: #fff; }
    .notif-box { background: #fef3c7; color: #1f2937; padding: 16px; border-radius: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; font-weight: 500; border-left: 4px solid #f59e0b; }
    /* ===== MOBILE-ONLY VIEW ===== */
        @media (min-width: 481px) {
        html { background: #050505; }
        body { max-width: 480px; margin: 0 auto !important; min-height: 100vh; box-shadow: 0 0 60px rgba(0,0,0,0.8); }
        #albumList { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
    }
    /* ===== MODAL STATISTIK ===== */
    .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center}
    .modal-ov.show{display:flex}
    .modal-ct{background:#111;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:24px}
    @media(min-width:481px){.modal-ct{border-radius:20px;margin-bottom:24px}}
    .stat-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:12px;text-align:center}
    .stat-bar-bg{height:6px;background:#1a1a1a;border-radius:3px;overflow:hidden}
    .stat-bar-fill{height:100%;background:linear-gradient(90deg,#22d3ee,#3b82f6);border-radius:3px;transition:width .3s}
</style>
</head>
<body class="min-h-screen">

<header class="border-b border-[#1a1a1a] bg-[#0a0a0a] sticky top-0 z-10">
    <div class="container mx-auto px-4 py-3 flex items-center justify-between">
        <div>
            <h1 class="text-lg font-bold">Dashboard Saya</h1>
        </div>
        <div class="flex gap-2 items-center">
            <a href="about.html" class="btn-g flex items-center gap-2" style="text-decoration:none">
                <i class="fas fa-info-circle"></i> <span class="hidden sm:inline">Tentang App</span>
            </a>
            <button onclick="logout()" class="btn-g flex items-center gap-2">
                <i class="fas fa-right-from-bracket text-xs"></i> Logout
            </button>
        </div>
    </div>
</header>

<main class="container mx-auto px-4 py-8">
    <!-- Notifikasi Kustom -->
    <div id="customNotif" class="notif-box hidden">
        <span id="notifText"></span>
        <button onclick="dismissNotif()" class="text-gray-500 hover:text-gray-800 ml-4"><i class="fas fa-times"></i></button>
    </div>

    <div class="bg-[#111] border border-[#2a2a2a] rounded-2xl p-5 mb-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
            <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Akun Aktif</p>
            <h2 id="userEmail" class="text-xl font-bold text-white">Loading...</h2>
            <p class="text-sm text-gray-400 mt-1"><i class="fab fa-whatsapp text-green-500 mr-1"></i><span id="userWa">-</span></p>
        </div>
        <button onclick="createNewAlbum()" class="btn-a flex items-center gap-2">
            <i class="fas fa-plus"></i> Buat Album Baru
        </button>
    </div>

    <div>
        <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-4">Album Saya</h3>
        <div id="albumList" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="col-span-full text-center text-gray-500 py-10">
                <i class="fas fa-spinner fa-spin text-2xl mb-3"></i>
                <p>Memuat album...</p>
            </div>
        </div>
    </div>
</main>

<!-- Modal Statistik Album -->
<div id="statsModal" class="modal-ov" onclick="if(event.target===this)closeAlbumStats()">
    <div class="modal-ct">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-bold" id="statsAlbumTitle">Statistik Album</h3>
            <button onclick="closeAlbumStats()" class="text-gray-400 hover:text-white" style="background:none;border:none;cursor:pointer"><i class="fas fa-xmark text-lg"></i></button>
        </div>
        <select id="statsPeriod" class="inp mb-4" style="max-width:180px" onchange="loadAlbumStats()">
            <option value="7">7 Hari</option>
            <option value="30" selected>30 Hari</option>
            <option value="90">90 Hari</option>
        </select>
        <div id="statsSummary" class="grid grid-cols-3 gap-2 mb-4"></div>
        <div id="statsCardList"></div>
    </div>
</div>

<footer style="font-family: 'Poppins', sans-serif; text-align: center; padding: 30px 16px; margin-top: 40px; border-top: 1px solid #1a1a1a;">
    <p style="font-size: 12px; color: #555; margin-bottom: 8px; letter-spacing: 0.5px;">feed.novavariety.store</p>
    <p style="font-size: 12px; color: #888;">
        Layanan CS : 
        <a href="https://wa.me/6288108292759?text=Halo%20Admin%20Nova%20Variety,%20saya%20butuh%20bantuan" target="_blank" style="color: #25d366; text-decoration: underline; font-style: italic;">
            <i class="fab fa-whatsapp"></i> 0881082928759
        </a>
    </p>
</footer>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXLvuPUsI6jz5wmKRzOmR-R1NQcVbkfu0",
      authDomain: "feed-editor-93db1.firebaseapp.com",
      projectId: "feed-editor-93db1",
      storageBucket: "feed-editor-93db1.firebasestorage.app",
      messagingSenderId: "249842615247",
      appId: "1:249842615247:web:6ef4a9713bdccc5f5508ba"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentUserData = null;

    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            loadUserData(user.uid);
            loadAlbums(user.uid);
        } else {
            window.location.href = "login.html";
        }
    });

    function loadUserData(uid) {
        db.collection('users').doc(uid).onSnapshot((doc) => {
            if (doc.exists) {
                currentUserData = doc.data();
                document.getElementById('userEmail').innerText = currentUserData.email;
                document.getElementById('userWa').innerText = currentUserData.whatsapp || 'Belum diisi';
                
                if(currentUserData.status === 'suspended') {
                    alert('Akun Anda dinonaktifkan oleh Admin.');
                    logout();
                }

                if(currentUserData.customNotif) {
                    document.getElementById('notifText').innerText = currentUserData.customNotif;
                    document.getElementById('customNotif').classList.remove('hidden');
                } else {
                    document.getElementById('customNotif').classList.add('hidden');
                }
            }
        });
    }

    function dismissNotif() {
        document.getElementById('customNotif').classList.add('hidden');
    }

    function loadAlbums(uid) {
        db.collection('albums').where('userId', '==', uid).onSnapshot((snapshot) => {
            const listContainer = document.getElementById('albumList');
            if (snapshot.empty) {
                listContainer.innerHTML = `<div class="col-span-full empty-state"><i class="fas fa-images text-4xl mb-4"></i><h4 class="text-lg font-bold text-gray-300 mb-2">Belum ada Album</h4><p class="mb-4">Mulai buat Album Feed pertama Anda sekarang!</p><button onclick="createNewAlbum()" class="btn-a">+ Buat Album Baru</button></div>`;
                return;
            }
            let html = '';
            snapshot.forEach((doc) => {
                const album = doc.data();
                const albumId = doc.id;
                const cardCount = album.cards ? album.cards.length : 0;
                const ogImg = album.ogImage || (album.cards && album.cards[0] && album.cards[0].images && album.cards[0].images[0] && album.cards[0].images[0].url ? album.cards[0].images[0].url : 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225"><rect width="100%" height="100%" fill="#111"/><text x="50%" y="52%" fill="#444" font-family="sans-serif" font-size="18" text-anchor="middle">No Image</text></svg>'));
                html += `<div class="album-card flex flex-col"><div class="aspect-video bg-[#0a0a0a] overflow-hidden"><img src="${ogImg}" alt="${album.name}" class="w-full h-full object-cover opacity-90"></div><div class="p-4 flex-1 flex flex-col"><h4 class="font-bold text-white truncate mb-1">${album.name}</h4><p class="text-xs text-gray-500 mb-3"><i class="fas fa-layer-group mr-1"></i> ${cardCount} Feed Card</p><div class="flex gap-2 mt-auto"><button onclick="editAlbum('${albumId}')" class="btn-a flex-1 text-sm" style="padding:8px 12px;"><i class="fas fa-pen mr-1"></i> Buka Album</button><button onclick="openAlbumStats('${albumId}')" class="btn-g text-sm text-cyan-400" style="padding:8px 12px;" title="Statistik Album"><i class="fas fa-chart-line"></i></button><button onclick="deleteAlbum('${albumId}', '${album.name.replace(/'/g, "\\'")}')" class="btn-g text-sm text-red-500" style="padding:8px 12px;" title="Hapus Album"><i class="fas fa-trash"></i></button></div></div></div>`;
            });
            listContainer.innerHTML = html;
        });
    }

    function createNewAlbum() {
        let limit = currentUserData.albumLimit || 2;
        let currentAlbumCount = document.querySelectorAll('.album-card').length;
        if(currentAlbumCount >= limit) {
            alert('Batas Maksimal! Anda sudah mencapai limit ' + limit + ' Album. Hubungi Admin untuk peningkatan batas.');
            return;
        }
        const name = prompt("Masukkan nama album baru:", "Album Feed Saya");
        if (!name) return;
        db.collection('albums').add({
            name: name, userId: currentUser.uid, status: 'active', bgColor: '#1a1a2e', ogImage: '', gaId: '', gaName: '',
            slug: name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/[\s_]+/g, '-').replace(/-+/g, '-').slice(0,60) || 'album-' + Date.now(),
            monetagEnabled: false, cards: [], banners: [], createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then((docRef) => { window.location.href = `index.html?albumId=${docRef.id}`; })
          .catch((error) => { alert("Gagal membuat album: " + error.message); });
    }

    function editAlbum(albumId) { window.location.href = `index.html?albumId=${albumId}`; }
    function deleteAlbum(albumId, albumName) {
        if (confirm(`Yakin ingin menghapus album "${albumName}"?`)) {
            db.collection('albums').doc(albumId).delete().catch((error) => alert("Gagal menghapus: " + error.message));
        }
    }
    function logout() { auth.signOut().then(() => window.location.href = "login.html"); }

    // ===== STATISTIK ALBUM (FASE 2) =====
    let statsAlbumId = null;
    let statsAlbumData = null;

    function openAlbumStats(albumId) {
        statsAlbumId = albumId;
        statsAlbumData = null;
        document.getElementById('statsSummary').innerHTML = '<p style="color:#666;text-align:center;padding:20px;grid-column:span-3">Memuat...</p>';
        document.getElementById('statsCardList').innerHTML = '';
        document.getElementById('statsModal').classList.add('show');
        db.collection('albums').doc(albumId).get().then((doc) => {
            if (!doc.exists) { closeAlbumStats(); return; }
            statsAlbumData = doc.data();
            document.getElementById('statsAlbumTitle').textContent = '📊 ' + (statsAlbumData.name || 'Album');
            loadAlbumStats();
        });
    }

    function closeAlbumStats() {
        document.getElementById('statsModal').classList.remove('show');
    }

    function loadAlbumStats() {
        if (!statsAlbumId) return;
        const days = parseInt(document.getElementById('statsPeriod').value) || 30;
        const startDate = new Date(Date.now() - days * 86400000).toISOString().slice(0, 10);
        document.getElementById('statsSummary').innerHTML = '<p style="color:#666;text-align:center;padding:20px;grid-column:span-3">Memuat...</p>';
        document.getElementById('statsCardList').innerHTML = '';

        db.collection('stats_daily').where('albumId', '==', statsAlbumId).get().then((snap) => {
            const totals = { views: 0, likes: 0, shares: 0, comments: 0, ctaClicks: 0 };
            const byCard = {};

            snap.forEach((doc) => {
                const d = doc.data();
                if (d.date < startDate) return;
                ['views','likes','shares','comments','ctaClicks'].forEach(k => {
                    const v = d[k] || 0;
                    totals[k] += v;
                    if (d.cardIdx >= 0) {
                        if (!byCard[d.cardIdx]) byCard[d.cardIdx] = { views: 0, likes: 0, shares: 0, comments: 0, ctaClicks: 0 };
                        byCard[d.cardIdx][k] += v;
                    }
                });
            });

            const items = [
                ['Views', totals.views, '#22d3ee'],
                ['Likes', totals.likes, '#ef4444'],
                ['Shares', totals.shares, '#3b82f6'],
                ['Komentar', totals.comments, '#a78bfa'],
                ['CTA Klik', totals.ctaClicks, '#4ade80']
            ];
            let sh = '';
            items.forEach(([label, val, color]) => {
                sh += `<div class="stat-card"><p style="font-size:11px;color:#666">${label}</p><p style="font-size:20px;font-weight:700;color:${color}">${val.toLocaleString('id-ID')}</p></div>`;
            });
            document.getElementById('statsSummary').innerHTML = sh;

            const cardIdxs = Object.keys(byCard);
            const cards = (statsAlbumData && Array.isArray(statsAlbumData.cards)) ? statsAlbumData.cards : [];
            if (cardIdxs.length === 0) {
                document.getElementById('statsCardList').innerHTML = '<p style="color:#666;text-align:center;padding:16px;font-size:13px">Belum ada data. Statistik mulai tercatat saat feed dikunjungi.</p>';
                return;
            }
            const maxV = Math.max(1, ...cardIdxs.map(ci => byCard[ci].views));
            let ch = '<p style="font-size:12px;color:#888;margin-bottom:10px;font-weight:600">PERFORMA PER CARD:</p>';
            cardIdxs.sort((a, b) => parseInt(a) - parseInt(b)).forEach((ci) => {
                const s = byCard[ci];
                const card = cards[parseInt(ci)];
                const title = (card && card.title && card.title.text) ? card.title.text : 'Card ' + (parseInt(ci) + 1);
                const barW = Math.round((s.views / maxV) * 100);
                ch += `<div style="margin-bottom:12px">
                    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                        <span style="color:#ccc;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%">${title}</span>
                        <span style="color:#888;flex-shrink:0">${s.views}v · ${s.likes}l · ${s.ctaClicks} CTA</span>
                    </div>
                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${barW}%"></div></div>
                </div>`;
            });
            document.getElementById('statsCardList').innerHTML = ch;
        }).catch((e) => {
            document.getElementById('statsSummary').innerHTML = '<p style="color:#f87171;text-align:center;padding:20px;grid-column:span-3">Gagal: ' + e.message + '</p>';
        });
    }
</script>
</body>
</html>
