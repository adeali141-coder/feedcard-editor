<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Album Feed</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    /* ==========================================
       PENGATURAN MANUAL LAYOUT (UBAH DI SINI)
       ========================================== */
    :root {
        --card-height: 110vh; 
        --content-bottom: 110px; 
        --actions-bottom: 250px; 
        --text-stroke: 1px 1px 2px rgba(0,0,0,0.9), -1px -1px 2px rgba(0,0,0,0.9), 0 0 2px #000; 
        --title-line-height: 1.2; 
        --desc-line-height: 1.2; 
        --cta-padding: 5px 18px; 
        --footer-font-size: 12px; 
        --footer-text-stroke: 1px 1px 2px rgba(0,0,0,0.9); 
        --counter-stroke: 1px 1px 2px rgba(0,0,0,0.9), -1px -1px 2px rgba(0,0,0,0.9); 

        /* ===== PENGATURAN MINI PROMO ===== */
        /* MODE OTOMATIS (default): ukuran kotak mengikuti rasio tiap slide */
        --mini-promo-w: 100px;
        --mini-promo-h: auto;
        /* MODE MANUAL: isi KEDUA variabel di atas dengan angka, contoh:
           --mini-promo-w: 100px;  --mini-promo-h: 178px;
           Maka SEMUA slide berukuran sama (gambar dipotong rapi). */
        --mini-promo-left: 4px;      /* jarak dari sisi kiri layar */
        --mini-promo-bottom: 570px;  /* jarak dari sisi bawah layar */
    }
    /* ========================================== */

    *{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none}
    ::-webkit-scrollbar{display:none}
    html, body { overflow-x: hidden; width: 100%; }
    body{font-family:'DM Sans',sans-serif;background:#000;color:#f0f0f0;}
    
    .feed-scroll{scroll-snap-type: y mandatory; overflow-y:scroll; overflow-x: hidden; height:95vh; background:#000;}
    .feed-card-wrap{scroll-snap-align: start; min-height: var(--card-height); width: 100%; position: relative; display: flex; flex-direction: column; overflow: hidden; border-bottom: 20px solid #000; padding: 0; margin: 0;}
    
    .feed-bg-slider{position:absolute; top:0 !important; left:0 !important; width:100%; height:100%; z-index:0; margin:0 !important; padding:0 !important;}
    .feed-bg-slider img, .feed-bg-slider video, .feed-bg-slider iframe{
        width:100% !important; height:100% !important; object-fit:cover; object-position: top center; display:block; position:absolute !important; top:0 !important; left:0 !important; border:none; margin:0 !important; padding:0 !important;
    }
    .slider-track{display:flex; transition:transform .4s cubic-bezier(.25,.8,.25,1); height:100%; width:100%;}
    .slide{min-width:100%; height:100%; display:flex; justify-content:center; align-items:flex-start; position:relative;}
    
    .feed-overlay{position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events: none;}

    /* ============================================================
       MINI PROMO (Tombol X di luar gambar + ukuran via :root)
       ============================================================ */
    .mini-promo-outer{position:absolute; left:var(--mini-promo-left,4px); bottom:var(--mini-promo-bottom,575px); z-index:4;}
    .mini-promo-container{position:relative; border-radius:8px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.5); background:rgba(255,255,255,0.07); transition:width .4s ease, height .4s ease;}
    .mini-promo-track{display:flex; transition:transform .5s ease-in-out; height:100%;}
    .mini-promo-slide{min-width:100%; height:100%;}
    .mini-promo-slide a{display:block; width:100%; height:100%;}
    .mini-promo-slide img{width:100%; height:100%; object-fit:cover; display:block;}
    /* Tombol X: 20px (sebelumnya 25px), pojok kanan-atas, mayoritas DI LUAR gambar.
       Mau 100% di luar gambar? Ubah right:-10px menjadi right:-32px */
    .mini-promo-close{position:absolute; top:-10px; right:-10px; width:20px; height:20px; background:rgba(0,0,0,0.65); color:#fff; border:1px solid rgba(255,255,255,0.55); border-radius:50%; font-size:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:5; box-shadow:0 2px 6px rgba(0,0,0,0.45);}
    .mini-promo-container.mp-img-broken{background:#161616;}
    /* ============================================================ */
    
    .feed-content{position:absolute; bottom: var(--content-bottom); left:0; right:0; z-index:2; padding: 0 20px; padding-right: 60px; max-width: 500px; margin: 0 auto; width: 100%; text-shadow: var(--text-stroke); display: flex; flex-direction: column;}
    
    .feed-actions{position:absolute; right: 10px; bottom: var(--actions-bottom); z-index:3; display: flex; flex-direction: column; gap: 15px; align-items: center; text-shadow: var(--text-stroke);}
    .feed-actions button{color:#fff; background:none; border:none; text-align:center; display:flex; flex-direction:column; align-items:center; font-size:12px; cursor:pointer; font-weight:600;}
    .feed-actions i{font-size: 26px; margin-bottom: 4px; filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.9));}
    .like-btn.liked{color:#ef4444;}
    .feed-actions span { text-shadow: var(--counter-stroke); }
    
    .slider-nav-btn{position:absolute; top:32vh; transform:translateY(-50%); width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.4); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:4; border:none;}
    
    .slider-dots-top{position:absolute; top:2vh; left:50%; transform:translateX(-50%); z-index:4; display:flex; gap:6px;}
    .slider-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.4);transition:all .3s;cursor:pointer;}.slider-dot.active{background:#e8572a;transform:scale(1.5)}

    @keyframes heartPop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
    .heart-pop{animation:heartPop .3s ease}
    
    /* FITUR SEE MORE */
    .desc-clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
    .desc-expanded { max-height: 50vh; overflow-y: auto; }
    .see-more-btn { display: none; color: #fff; font-weight: 600; cursor: pointer; margin-top: 4px; text-shadow: var(--text-stroke); }
    
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a1a;border:1px solid #2a2a2a;color:#f0f0f0;padding:12px 24px;border-radius:12px;font-size:14px;z-index:200;transition:transform .4s;pointer-events:none}.toast.show{transform:translateX(-50%) translateY(0)}
    .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}.modal-ov.show{opacity:1;pointer-events:all}
    .modal-ct{background:#111;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.25,.8,.25,1);padding:24px}
    .modal-ov.show .modal-ct{transform:translateY(0)}
    @media(min-width:640px){.modal-ct{border-radius:20px;margin-bottom:10%;max-height:70vh}}
    .inp{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:10px 12px;color:#f0f0f0;width:100%;font-size:14px;outline:none;transition:border .2s}
    .btn-a{background:linear-gradient(135deg,#e8572a,#ff7e47);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:600;cursor:pointer;transition:all .2s;font-size:14px;width:100%}
    
    #promoFooter{position:fixed; bottom:0; left:0; right:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); border-top:1px solid #222; padding:8px 16px; z-index:50; display:none; justify-content:center; align-items:center; gap:12px; font-size: var(--footer-font-size); text-shadow: var(--footer-text-stroke);}
</style>
</head>
<body>

<div id="toast" class="toast"></div>
<div id="appLoad" class="h-screen flex items-center justify-center">
    <i class="fas fa-spinner fa-spin text-3xl text-orange-500"></i>
</div>
<div id="feedContainer" class="feed-scroll hidden"></div>
<div id="promoFooter"></div>

<div id="commentModal" class="modal-ov" onclick="if(event.target===this)closeCommentModal()"><div class="modal-ct"><div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold" id="commentModalTitle">Komentar</h3><button onclick="closeCommentModal()" class="text-gray-400 hover:text-white"><i class="fas fa-xmark text-lg"></i></button></div><div id="commentList" class="space-y-3 mb-4" style="max-height:50vh;overflow-y:auto"></div><div class="border-t pt-3" style="border-color:#222"><div class="flex gap-2 mb-2"><input id="commentAuthor" class="inp" style="padding:6px 10px;width:35%" placeholder="Nama" /></div><div class="flex gap-2"><input id="commentText" class="inp flex-1" style="padding:6px 10px" placeholder="Tulis komentar..." onkeydown="if(event.key==='Enter')submitComment()" /><button onclick="submitComment()" class="btn-a" style="padding:6px 14px;width:auto"><i class="fas fa-paper-plane"></i></button></div></div></div></div>
<div id="shareModal" class="modal-ov" onclick="if(event.target===this)closeShareModal()"><div class="modal-ct"><div class="flex items-center justify-between mb-5"><h3 class="text-lg font-bold">Bagikan</h3><button onclick="closeShareModal()" class="text-gray-400 hover:text-white"><i class="fas fa-xmark text-lg"></i></button></div><div class="mb-4"><label class="text-xs text-gray-400 mb-1 block">Link</label><div class="flex gap-2"><input id="shareLinkInput" class="inp flex-1" style="font-size:11px" readonly /><button onclick="copyShareLink()" class="btn-a" style="padding:8px 12px;font-size:12px;width:auto"><i class="fas fa-copy"></i></button></div></div><div class="space-y-2"><button onclick="shareToFacebook()" class="btn-a flex items-center gap-2" style="background:#1877f2"><i class="fab fa-facebook-f w-6 text-center"></i> Facebook</button><button onclick="shareToWhatsApp()" class="btn-a flex items-center gap-2" style="background:#25d366"><i class="fab fa-whatsapp w-6 text-center"></i> WhatsApp</button></div></div></div>
<div id="reportModal" class="modal-ov" onclick="if(event.target===this)closeReportModal()"><div class="modal-ct"><div class="flex items-center justify-between mb-5"><h3 class="text-lg font-bold">Laporkan Feed Ini</h3><button onclick="closeReportModal()" class="text-gray-400 hover:text-white"><i class="fas fa-xmark text-lg"></i></button></div><p class="text-sm text-gray-400 mb-4">Beri tahu admin mengapa feed ini perlu ditinjau.</p><textarea id="reportReason" class="inp mb-4" rows="5" placeholder="Tulis alasan pelaporan di sini..."></textarea><button onclick="submitReport()" class="btn-a">Kirim Laporan</button></div></div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXLvuPUsI6jz5wmKRzOmR-R1NQcVbkfu0",
      authDomain: "feed-editor-93db1.firebaseapp.com",
      projectId: "feed-editor-93db1",
      storageBucket: "feed-editor-93db1.firebasestorage.app",
      messagingSenderId: "249842615247",
      appId: "1:249842615247:web:6ef4a9713bdccc5f5508ba"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const functions = firebase.app().functions('us-central1');

    let currentUserId = null;
    firebase.auth().onAuthStateChanged((user) => {
        if (user) currentUserId = user.uid;
    });

    const videoObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            let card = entry.target;
            if (entry.isIntersecting) {
                let iframes = card.querySelectorAll('iframe[data-src]');
                iframes.forEach(v => { if(!v.getAttribute('src')) v.setAttribute('src', v.dataset.src); });
                let videos = card.querySelectorAll('video[data-src]');
                videos.forEach(v => { if(!v.getAttribute('src')) { v.setAttribute('src', v.dataset.src); v.play().catch(()=>{}); } });
            } else {
                let iframes = card.querySelectorAll('iframe');
                iframes.forEach(v => { if(v.getAttribute('src')) v.removeAttribute('src'); });
                let videos = card.querySelectorAll('video');
                videos.forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); });
            }
        });
    }, { threshold: 0.3 });

    function observeVideos() {
        document.querySelectorAll('.feed-card-wrap').forEach(card => videoObserver.observe(card));
    }

    let currentAlbum = null, currentAlbumId = null;
    let commentCardIdx = -1, replyTo = null, sliderState = {}, currentReportFeedIdx = -1;
    let currentAlbumComments = [], globalFooterData = null;

    const urlParams = new URLSearchParams(window.location.search);
    currentAlbumId = urlParams.get('albumId');

    if (!currentAlbumId) {
        document.getElementById('appLoad').innerHTML = '<p class="text-gray-500">Album tidak ditemukan.</p>';
    } else {
        loadAlbum();
    }

    function loadAlbum() {
        db.collection('albums').doc(currentAlbumId).get().then((doc) => {
            if (!doc.exists) { document.getElementById('appLoad').innerHTML = '<p class="text-gray-500">Album tidak ditemukan.</p>'; return; }
            currentAlbum = doc.data();
            if(currentAlbum.status === 'suspended') { document.getElementById('appLoad').innerHTML = '<p class="text-red-500 text-center px-4">Album ini telah ditangguhkan oleh Admin.</p>'; return; }

            document.title = currentAlbum.name;
            document.getElementById('appLoad').classList.add('hidden');
            document.getElementById('feedContainer').classList.remove('hidden');
            renderFeeds();
            
            db.collection('comments').where('albumId', '==', currentAlbumId).onSnapshot((snapshot) => {
                currentAlbumComments = [];
                snapshot.forEach(doc => currentAlbumComments.push(doc.data()));
                updateCommentCounts();
            });

            const cardParams = new URLSearchParams(window.location.search);
            const cardHumanIdx = cardParams.get('card');
            if(cardHumanIdx !== null) {
                const dbIdx = parseInt(cardHumanIdx) - 1;
                setTimeout(() => {
                    let targetCard = document.getElementById('target-card-' + dbIdx);
                    if(targetCard) targetCard.scrollIntoView({behavior: 'smooth', block: 'start'});
                }, 500);
            }
            
            db.collection('settings').doc('footer').get().then((doc) => {
                if(doc.exists) { globalFooterData = doc.data(); renderPromoFooter(); }
            });
        }).catch((error) => {
            console.error("Error loading album:", error);
            document.getElementById('appLoad').innerHTML = '<p class="text-red-500">Gagal memuat album.<br>' + error.message + '</p>';
        });
    }

    function escA(s){return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');}
    function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

    function parseDesc(text) {
        if(!text) return '';
        let t = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        let links = [];
        t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (match, p1, p2) => {
            let linkHtml = `<a href="${p2}" target="_blank" style="color:#a8ff72; text-decoration:underline; font-weight:600;">${p1}</a>`;
            links.push(linkHtml);
            return `___LINK_PLACEHOLDER_${links.length-1}___`;
        });
        t = t.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" style="color:#3b82f6; text-decoration:underline; font-weight:600;">$1</a>');
        t = t.replace(/___LINK_PLACEHOLDER_(\d+)___/g, (match, idx) => links[parseInt(idx)]);
        return t.replace(/\n/g,'<br>');
    }

    function renderFeeds() {
        let cards = currentAlbum.cards || [];
        let html = '', activeCardCount = 0;
        
        for(let i=0; i<cards.length; i++) {
            let c = cards[i];
            if(c.status === 'suspended') continue; 
            
            if(c.hideActions === undefined) c.hideActions = false;
            
            let tf = c.title.font === 'sans-serif' ? 'sans-serif' : ("'"+c.title.font+"', sans-serif");
            let df = c.desc.font === 'sans-serif' ? 'sans-serif' : ("'"+c.desc.font+"', sans-serif");
            let sid = 'slider_'+i;
            sliderState[sid] = 0;
            
            let vi = c.images.filter(img => img.url);
            if(c.videoUrl) vi.unshift({url: c.videoUrl, link: ''});
            
            let sh = vi.map((img, idx) => {
                let mediaHtml = '';
                let url = img.url;
                let styleCover = "position:absolute; top:0; left:0; width:100%; height:100%; border:none; margin:0; padding:0; object-fit:cover; object-position:top center;";
                let styleContain = "position:absolute; top:0; left:0; width:100%; height:100%; border:none; margin:0; padding:0; object-fit:contain; object-position:top center;";
                
                if (url.indexOf('youtube.com') >= 0 || url.indexOf('youtu.be') >= 0) {
                    let vid = '';
                    try {
                        let u = new URL(url);
                        if (u.hostname.indexOf('youtube.com') >= 0) {
                            if (u.pathname.startsWith('/shorts/')) vid = u.pathname.split('/')[2];
                            else vid = u.searchParams.get('v') || '';
                        }
                        if (u.hostname.indexOf('youtu.be') >= 0) vid = u.pathname.slice(1);
                    } catch(e) {}
                    if(vid) mediaHtml = `<iframe data-src="https://www.youtube.com/embed/${vid}?autoplay=0&loop=1&playlist=${vid}&controls=1&modestbranding=1&playsinline=1" src="" style="${styleCover}" allow="encrypted-media" allowfullscreen></iframe>`;
                } 
                else if (url.indexOf('screenpal.com/player/') >= 0) {
                    mediaHtml = `<iframe data-src="${escA(url)}" src="" style="${styleCover}" allowfullscreen="true" scrolling="no"></iframe>`;
                } 
                else if (url.endsWith('.mp4') || url.endsWith('.webm')) {
                    mediaHtml = `<video data-src="${escA(url)}" src="" loop muted playsinline style="${styleCover}"></video>`;
                } 
                else {
                    mediaHtml = `<img src="${escA(url)}" loading="lazy" style="${styleContain}" />`;
                }
                
                if (img.link) {
                    return `<div class="slide"><a href="${escA(img.link)}" target="_blank" style="width:100%;height:100%;display:block;">${mediaHtml}</a></div>`;
                }
                return `<div class="slide">${mediaHtml}</div>`;
            }).join('');

            let dh = vi.map((s, idx) => `<div class="slider-dot${idx===0?' active':''}" onclick="goSlide('${sid}',${idx})"></div>`).join('');
            let slidesArr = vi; 
            
            let ctaHtml = '';
            if(c.cta && c.cta.text) {
                ctaHtml = `<a href="${escA(c.cta.url)}" target="_blank" rel="noopener" style="text-decoration:none; display:inline-block; margin-bottom:12px;">
                    <button style="background:${c.cta.bgColor};color:${c.cta.textColor};border-radius:25px;padding:var(--cta-padding);font-size:14px;font-weight:600;border:none;cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">${escH(c.cta.text)}</button>
                </a>`;
            }

            let bgHtml = '';
            if (slidesArr.length > 0) {
                bgHtml = `<div class="feed-bg-slider" id="${sid}">
                            <div class="slider-track" id="track_${sid}">${sh}</div>
                          </div>
                          <div class="feed-overlay"></div>
                          ${slidesArr.length > 1 ? `
                            <button onclick="slideNav('${sid}',-1)" class="slider-nav-btn" style="left:8px;"><i class="fas fa-chevron-left"></i></button>
                            <button onclick="slideNav('${sid}',1)" class="slider-nav-btn" style="right:8px;"><i class="fas fa-chevron-right"></i></button>
                            <div class="slider-dots-top" id="dots_${sid}">${dh}</div>
                          ` : ''}`;
            } else {
                bgHtml = `<div style="position:absolute; inset:0; background:${c.bgColor}; z-index:0;"></div><div class="feed-overlay" style="background: none;"></div>`;
            }

            // ============================================================
            // MINI PROMO HTML GENERATOR (X di luar gambar + ukuran Manual/Auto)
            // ============================================================
            let miniPromoHtml = '';
            if (c.miniPromos && c.miniPromos.length > 0) {
                window.allMiniPromos = window.allMiniPromos || {};
                window.allMiniPromos[i] = c.miniPromos;

                let firstRatio = c.miniPromos[0].ratio || '1:1';
                let mps = getMiniPromoSize(firstRatio);

                let trackHtml = c.miniPromos.map(p =>
                    `<div class="mini-promo-slide"><a href="${escA(p.link || '#')}" target="_blank" rel="noopener"><img src="${escA(p.img)}" referrerpolicy="no-referrer" decoding="async" onerror="miniPromoImgError(this)" alt="promo"></a></div>`
                ).join('');

                miniPromoHtml = `<div class="mini-promo-outer" id="miniPromoOuter_${i}">
                    <button class="mini-promo-close" onclick="closeMiniPromo(${i})" aria-label="Tutup promo"><i class="fas fa-times"></i></button>
                    <div class="mini-promo-container" id="miniPromo_${i}" style="width:${mps.w}px; height:${mps.h}px;">
                        <div class="mini-promo-track" id="track_mp_${i}">${trackHtml}</div>
                    </div>
                </div>`;
            }
            // ============================================================

            html += `
                <div class="feed-card-wrap" id="target-card-${i}" style="background:${c.bgColor};">
                    ${bgHtml}
                    ${miniPromoHtml}
                    <div class="feed-content">
                        ${ctaHtml}
                        ${c.title && c.title.text ? `<h2 style="line-height:var(--title-line-height);font-family:${tf};font-size:${c.title.size}px;color:${c.title.color};font-weight:${c.title.bold?'700':'400'};margin-bottom:4px;">${escH(c.title.text)}</h2>` : ''}
                        ${c.price && c.price.text ? `<p style="font-size:${c.price.size}px;color:${c.price.color};font-weight:700;margin-bottom:8px;">${escH(c.price.text)}</p>` : ''}
                        ${c.desc && c.desc.text ? `
                            <p id="desc_${i}" class="desc-clamped" style="line-height:var(--desc-line-height);font-family:${df};font-size:${c.desc.size}px;color:${c.desc.color};white-space:pre-line;margin-bottom:4px;">${parseDesc(c.desc.text)}</p>
                            <span class="see-more-btn" id="seeMore_${i}" onclick="toggleDesc(${i})">... See more</span>
                        ` : ''}
                    </div>
            `;
            
            if(!c.hideActions) {
                html += `
                    <div class="feed-actions">
                        <button class="like-btn${c.liked?' liked':''}" id="likeBtn_${i}" onclick="toggleLike(${i})"><i class="fas fa-heart"></i><span id="likeCount_${i}">${c.likes||0}</span></button>
                        <button onclick="openCommentModal(${i})"><i class="fas fa-comment"></i><span id="commentCount_${i}">0</span></button>
                        <button onclick="openShareModal(${i})"><i class="fas fa-share"></i><span id="shareCount_${i}">${c.shares||0}</span></button>
                        <button onclick="openReportModal(${i})"><i class="fas fa-flag"></i></button>
                    </div>
                `;
            }
            
            html += `</div>`;
            activeCardCount++;
        }

        document.getElementById('feedContainer').innerHTML = html || '<div class="h-screen flex items-center justify-center"><p class="text-gray-500">Album kosong.</p></div>';
        observePromos();
        observeVideos();
        checkLongDescriptions();
    }

    function goSlide(sid,idx){
        var tr=document.getElementById('track_'+sid);
        if(!tr) return;
        var total=tr.children.length;
        if(idx<0) idx=total-1;
        if(idx>=total) idx=0;
        sliderState[sid]=idx;
        tr.style.transform='translateX(-'+(idx*100)+'%)';
        
        var dotsEl = document.getElementById('dots_'+sid);
        if(dotsEl) {
            var dc = dotsEl.children;
            for(var i=0;i<dc.length;i++){
                if(i===idx) dc[i].classList.add('active');
                else dc[i].classList.remove('active');
            }
        }
    }
    function slideNav(sid,dir){goSlide(sid,(sliderState[sid]||0)+dir);}
    document.addEventListener('touchstart',function(e){var s=e.target.closest('[id^="slider_"], [id^="ban_"]');if(!s)return;s._tx=e.changedTouches[0].clientX;},{passive:true});
    document.addEventListener('touchend',function(e){var s=e.target.closest('[id^="slider_"], [id^="ban_"]');if(!s||s._tx==null)return;var d=s._tx-e.changedTouches[0].clientX;if(Math.abs(d)>50)slideNav(s.id,d>0?1:-1);s._tx=null;},{passive:true});

    function toggleLike(i) {
        var c = currentAlbum.cards[i];
        var wasLiked = c.liked || false;
        var b = document.getElementById('likeBtn_' + i);
        var ct = document.getElementById('likeCount_' + i);
        c.liked = !wasLiked;
        if (b) { b.classList.toggle('liked', c.liked); b.classList.add('heart-pop'); setTimeout(function(){ b.classList.remove('heart-pop'); }, 300); }
        const incrementInteraction = functions.httpsCallable('incrementInteraction');
        incrementInteraction({ albumId: currentAlbumId, cardIdx: i, type: 'like', isDecrement: wasLiked })
        .then((result) => { if(result.data.success && ct) { ct.textContent = result.data.newValue; c.likes = result.data.newValue; } })
        .catch((error) => { c.liked = wasLiked; if (b) { b.classList.toggle('liked', c.liked); } showToast('Gagal menyimpan like'); });
    }

    function updateCommentCounts() {
        for(let i=0; i<currentAlbum.cards.length; i++) {
            let count = currentAlbumComments.filter(c => c.cardIdx == i && !c.parentId).length;
            let btn = document.getElementById('commentCount_' + i);
            if(btn) btn.innerText = count;
        }
    }
    function openCommentModal(i) { commentCardIdx = i; replyTo = null; document.getElementById('commentModalTitle').textContent = 'Komentar'; document.getElementById('commentAuthor').value = localStorage.getItem('acf_userName') || ''; document.getElementById('commentList').innerHTML = '<p style="color:#666;text-align:center;padding:16px 0;font-size:14px">Memuat komentar...</p>'; document.getElementById('commentModal').classList.add('show'); renderCmts(); }
    function closeCommentModal() { document.getElementById('commentModal').classList.remove('show'); commentCardIdx = -1; replyTo = null; }
    
    function renderCmts() {
        var el = document.getElementById('commentList');
        let parents = currentAlbumComments.filter(c => c.cardIdx == commentCardIdx && !c.parentId);
        if (!parents.length) { el.innerHTML = '<p style="color:#666;text-align:center;padding:16px 0;font-size:14px">Belum ada komentar</p>'; document.getElementById('commentModalTitle').textContent = 'Komentar (0)'; return; }
        document.getElementById('commentModalTitle').textContent = 'Komentar (' + parents.length + ')';
        var h = '';
        let isOwner = currentUserId === currentAlbum.userId;
        
        for (var ci = 0; ci < parents.length; ci++) {
            var cm = parents[ci];
            let delBtn = isOwner ? `<button onclick="deleteComment('${cm.commentId}')" style="font-size:11px;color:#f87171;background:none;border:none;cursor:pointer;margin-top:4px;margin-left:10px;"><i class="fas fa-trash"></i></button>` : '';
            h += `<div style="padding:12px;border-radius:12px;background:#1a1a1a;margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span style="font-size:13px;font-weight:600">${escH(cm.author || 'Anonim')}</span></div><p style="font-size:13px;margin-top:6px;color:#ccc">${escH(cm.text)}</p><div><button onclick="setReply('${cm.commentId}','${escA(cm.author || 'Anonim')}')" style="font-size:11px;color:#e8572a;background:none;border:none;cursor:pointer;margin-top:4px"><i class="fas fa-reply" style="margin-right:4px"></i>Balas</button>${delBtn}</div>`;
            
            let replies = currentAlbumComments.filter(r => r.parentId === cm.commentId);
            for (var ri = 0; ri < replies.length; ri++) {
                var r = replies[ri];
                let delBtnReply = isOwner ? `<button onclick="deleteComment('${r.commentId}')" style="font-size:10px;color:#f87171;background:none;border:none;cursor:pointer;margin-top:4px;margin-left:10px;"><i class="fas fa-trash"></i></button>` : '';
                h += `<div style="margin-left:32px;margin-top:8px;padding:8px;border-radius:8px;background:#222"><span style="font-size:12px;font-weight:600;color:#22d3ee">${escH(r.author || 'Anonim')}</span><p style="font-size:12px;margin-top:4px;color:#bbb">${escH(r.text)}</p><div><button onclick="setReply('${r.commentId}','${escA(r.author || 'Anonim')}')" style="font-size:10px;color:#e8572a;background:none;border:none;cursor:pointer;margin-top:4px"><i class="fas fa-reply" style="margin-right:4px"></i>Balas</button>${delBtnReply}</div></div>`;
            }
            h += `</div>`;
        }
        el.innerHTML = h;
    }
    function deleteComment(commentId) {
        if(confirm('Hapus komentar ini?')) {
            db.collection('comments').doc(commentId).delete()
            .then(() => showToast('Komentar dihapus.'))
            .catch(e => showToast('Gagal hapus: ' + e.message));
        }
    }
    function setReply(commentId, a) { replyTo = commentId; document.getElementById('commentText').placeholder = 'Membalas ' + a + '...'; document.getElementById('commentText').focus(); }
    function submitComment() {
        var a = document.getElementById('commentAuthor').value.trim() || 'Anonim';
        var t = document.getElementById('commentText').value.trim();
        if (!t) return;
        localStorage.setItem('acf_userName', a);
        var newCommentId = db.collection('comments').doc().id;
        db.collection('comments').doc(newCommentId).set({ commentId: newCommentId, albumId: currentAlbumId, cardIdx: commentCardIdx, author: a, text: t, parentId: replyTo || null, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
        .then(() => { document.getElementById('commentText').value = ''; document.getElementById('commentText').placeholder = 'Tulis komentar...'; replyTo = null; showToast('Komentar berhasil terkirim!'); })
        .catch((e) => { showToast('Gagal simpan komentar: ' + e.message); });
    }

    function openShareModal(cardIdx = -1) {
        let baseUrl = 'https://feed.novavariety.store/f/' + currentAlbumId;
        if(cardIdx >= 0) {
            baseUrl += '/' + (cardIdx + 1);
            if(currentAlbum.cards[cardIdx]) {
                let sc = document.getElementById('shareCount_' + cardIdx);
                if(sc) { let currentShares = parseInt(sc.innerText) || 0; sc.innerText = currentShares + 1; }
                const incrementInteraction = functions.httpsCallable('incrementInteraction');
                incrementInteraction({ albumId: currentAlbumId, cardIdx: cardIdx, type: 'share', isDecrement: false })
                .then((result) => { if(result.data.success && sc) { sc.innerText = result.data.newValue; } })
                .catch(e => console.error("Gagal track share:", e));
            }
        }
        document.getElementById('shareLinkInput').value = baseUrl;
        document.getElementById('shareModal').classList.add('show');
    }
    function closeShareModal(){document.getElementById('shareModal').classList.remove('show');}
    function copyShareLink(){var i=document.getElementById('shareLinkInput');i.select();navigator.clipboard.writeText(i.value).then(function(){showToast('Link disalin!');});}
    function shareToFacebook(){window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(document.getElementById('shareLinkInput').value),'_blank','width=600,height=400');}
    function shareToWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(document.getElementById('shareLinkInput').value),'_blank');}

    function openReportModal(idx){currentReportFeedIdx=idx;document.getElementById('reportModal').classList.add('show');}
    function closeReportModal(){document.getElementById('reportModal').classList.remove('show');}
    function submitReport(){
        let reason=document.getElementById('reportReason').value.trim();
        if(!reason){showToast('Mohon isi alasan');return;}
        let reportedCard=currentAlbum.cards[currentReportFeedIdx];
        let ownerId = currentAlbum.userId || null;
        db.collection('reports').add({albumId:currentAlbumId,albumName:currentAlbum.name,ownerId: ownerId,feedId:reportedCard.id,feedTitle:reportedCard.title.text,reason:reason,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()})
        .then(()=>{showToast('Laporan terkirim! Admin akan meninjau.');closeReportModal();document.getElementById('reportReason').value='';})
        .catch(e=>showToast('Gagal: '+e.message));
    }

    function renderPromoFooter() {
        let isFooterEnabled = currentAlbum.footerEnabled !== false;
        if(isFooterEnabled && globalFooterData && (globalFooterData.text || globalFooterData.imageUrl)) {
            let f = globalFooterData;
            let innerHtml = '';
            if(f.imageUrl) { innerHtml += `<img src="${escA(f.imageUrl)}" style="max-height:24px; max-width:60px; object-fit:contain; border-radius:4px;">`; }
            if(f.text) { innerHtml += `<span style="color:#fff; font-weight:600;">${escH(f.text)}</span>`; }
            let link = f.linkUrl || '#';
            let footerEl = document.getElementById('promoFooter');
            footerEl.innerHTML = `<a href="${escA(link)}" target="_blank" style="display:flex; align-items:center; gap:8px; text-decoration:none;">${innerHtml}</a>`;
            footerEl.style.display = 'flex';
        }
    }

    // ============================================================
    // MINI PROMO ROTATOR (Durasi dinamis + ukuran Manual/Auto)
    // ============================================================
    let miniPromoStates = {};
    let miniPromoIntervals = {};

    // Baca ukuran mini promo dari PENGATURAN MANUAL LAYOUT (:root)
    function getMiniPromoSize(ratio) {
        const cs = getComputedStyle(document.documentElement);
        let wNum = parseFloat(cs.getPropertyValue('--mini-promo-w'));
        let hNum = parseFloat(cs.getPropertyValue('--mini-promo-h'));

        // MODE MANUAL: kedua variabel berisi angka -> ukuran dikunci (semua slide sama)
        if (!isNaN(wNum) && wNum > 0 && !isNaN(hNum) && hNum > 0) {
            return { w: wNum, h: hNum, fixed: true };
        }

        // MODE OTOMATIS: ukuran mengikuti rasio tiap slide (perilaku lama)
        let base = (!isNaN(wNum) && wNum > 0) ? wNum : 80;
        let w = base, h = base;
        if (ratio == '9:16') h = Math.round(base * 16 / 9);
        if (ratio == '16:9') w = Math.round(base * 16 / 9);
        return { w: w, h: h, fixed: false };
    }

    // Fallback bila gambar mini promo gagal dimuat: coba 1x lagi, lalu tandai kotak
    function miniPromoImgError(img) {
        if (img.dataset.retried) {
            let box = img.closest('.mini-promo-container');
            if (box) box.classList.add('mp-img-broken');
            return;
        }
        img.dataset.retried = '1';
        img.src = img.src + (img.src.indexOf('?') >= 0 ? '&' : '?') + '_r=' + Date.now();
    }

    function initMiniPromos() {
        let containers = document.querySelectorAll('.mini-promo-container');
        containers.forEach(c => {
            let id = c.id.split('_')[1];
            miniPromoStates[id] = { idx: 0, visible: true };
            
            if(miniPromoIntervals[id]) clearInterval(miniPromoIntervals[id]);
            
            let cardData = currentAlbum.cards[id];
            let time = (cardData && cardData.miniPromoTime) ? cardData.miniPromoTime * 1000 : 3000;
            
            if (window.allMiniPromos[id] && window.allMiniPromos[id].length > 1) {
                miniPromoIntervals[id] = setInterval(() => {
                    if (miniPromoStates[id].visible) {
                        let tr = document.getElementById('track_mp_' + id);
                        let container = document.getElementById('miniPromo_' + id);
                        if(tr && container) {
                            let total = tr.children.length;
                            miniPromoStates[id].idx = (miniPromoStates[id].idx + 1) % total;
                            tr.style.transform = `translateX(-${miniPromoStates[id].idx * 100}%)`;
                            
                            // Auto-resize hanya di MODE OTOMATIS
                            let activePromo = window.allMiniPromos[id][miniPromoStates[id].idx];
                            let ratio = activePromo.ratio || '1:1';
                            let mps = getMiniPromoSize(ratio);
                            if (!mps.fixed) {
                                container.style.width = mps.w + 'px';
                                container.style.height = mps.h + 'px';
                            }
                        }
                    }
                }, time);
            }
        });
    }

    function closeMiniPromo(idx) {
        let el = document.getElementById('miniPromoOuter_' + idx);
        if (el) el.style.display = 'none';
        if (miniPromoStates[idx]) miniPromoStates[idx].visible = false;
    }

    const promoObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                let id = entry.target.id.replace('target-card-', '');
                if (miniPromoStates[id] && !miniPromoStates[id].visible) {
                    miniPromoStates[id].visible = true;
                    let el = document.getElementById('miniPromoOuter_' + id);
                    if (el) el.style.display = 'block';
                }
            }
        });
    }, { threshold: 0.5 });

    function observePromos() {
        document.querySelectorAll('.feed-card-wrap').forEach(card => promoObserver.observe(card));
        initMiniPromos();
    }
    // ============================================================

    // FITUR SEE MORE / SEE LESS
    function toggleDesc(idx) {
        let desc = document.getElementById('desc_' + idx);
        let btn = document.getElementById('seeMore_' + idx);
        if (desc.classList.contains('desc-clamped')) {
            desc.classList.remove('desc-clamped');
            desc.classList.add('desc-expanded');
            btn.innerText = 'See less';
        } else {
            desc.classList.remove('desc-expanded');
            desc.classList.add('desc-clamped');
            btn.innerText = '... See more';
        }
    }
    function checkLongDescriptions() {
        setTimeout(() => {
            document.querySelectorAll('.desc-clamped').forEach(el => {
                let id = el.id.split('_')[1];
                let btn = document.getElementById('seeMore_' + id);
                if (el.scrollHeight > el.clientHeight + 5) {
                    if(btn) btn.style.display = 'inline-block';
                }
            });
        }, 200);
    }
    
    function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}
</script>
